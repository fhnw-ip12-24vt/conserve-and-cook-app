version=1.0
environment=local

# We need to use the test database until we have all the assets
# Otherwise there will be IO-Exceptions
database.path=src/main/resources/database/database.db
#database.path=src/main/resources/database/test.db
joystick.enabled=false
barcode_scanner.enabled=false

# The game is developed for a resolution of 1080p
# This means that all the assets are in this resolution
# For local development, we want to scale that down
#screen.height=845
#screen.width=1540
#screen.scale=0.8

screen.height=540
screen.width=960
screen.scale=0.5

# How long a game can take, before the "game over" screen appears
game.duration=30


# Timeout until reset in seconds
screen.timeout=120